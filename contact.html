<main class="contact-page">
<div class="page-mast mast-mascot wardrobe-contact">
<img class="page-mast-art" src="./assets/img/5g-look-contact.jpg?v=20261124-6" width="768" height="341" alt="" decoding="async"><div class="wrap"><h1>お問い合わせ</h1></div></div>
<section class="wrap contact-content">
<div class="contact-intro"><button aria-label="戻る" class="backbtn" id="goBack">
<span class="arr">←</span>
<span class="txt">戻る</span>
</button><p>ご質問、団体利用のお見積もり、予約に関するご相談は、こちらのフォームよりお問い合わせください。内容を確認のうえ、担当者よりご連絡いたします。</p></div>
<form action="#" data-gas-only="1" id="contactForm" method="POST">
<div class="row">
<div>
<label class="req" for="name">お名前 <span class="required-mark">必須</span></label>
<input autocomplete="name" id="name" maxlength="80" name="name" placeholder="例：山田 太郎" required=""/>
</div>
<div>
<label class="req" for="email">メールアドレス <span class="required-mark">必須</span></label>
<input autocomplete="email" id="email" maxlength="120" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<div class="row">
<div>
<label for="phone">電話番号</label>
<input autocomplete="tel" type="tel" id="phone" maxlength="30" name="phone" placeholder="080-XXXX-XXXX"/>
</div>
<div>
<label for="topic">お問い合わせ種別</label>
<select id="topic" name="topic">
<option value="general">一般お問い合わせ</option>
<option value="estimate">団体利用のお見積もり</option>
<option value="support">ご意見・ご要望</option>
</select>
</div>
</div>
<div>
<label class="req" for="message">お問い合わせ内容 <span class="required-mark">必須</span></label>
<textarea id="message" maxlength="2000" name="message" placeholder="お問い合わせ内容をご記入ください" required="" rows="6"></textarea>
<div class="hint">最大 2000 文字</div>
</div>

<input autocomplete="off" name="website" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden" tabindex="-1" type="text"/>
<button class="btn" type="submit">送信する</button>
<div class="status" id="status" role="status" aria-live="polite"></div>
</form>
</section>
</main>
<footer class="site-footer pro">
<div class="container footer-wrap">
<div class="f-col policies">
<ul class="f-links footer-policies footer-inline"><li><span class="copyright-inline">© ESPORTS CAFE 5G</span></li>

<li><a href="tokushoho.html">特定商取引法に基づく表示</a></li>
</ul>
</div>
</div>
</footer>

<script defer="" src="./gas.email.js?v=20261124-2"></script>
<script>
    // Back button behavior: go to previous page, otherwise go to index.html
    document.addEventListener('DOMContentLoaded', function(){
      var btn = document.getElementById('goBack');
      if(btn){
        btn.addEventListener('click', function(e){
          e.preventDefault();
          if (history.length > 1) history.back();
          else window.location.href = 'index.html';
        });
      }
    });
  </script>
<script src="./script.js?v=20261125-3"></script>
</body>
</html>
